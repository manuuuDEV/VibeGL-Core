name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.1
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build workspace
        run: pnpm run build
        
      - name: Export static site
        run: |
          cd apps/docs
          pnpm run export

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/docs/out

# Note: using gh-pages branch deployment instead of the actions/pages API due to API restrictions in this repo's environment

